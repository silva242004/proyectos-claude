<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonnet 5.5 — Presentación</title>
<style>
  :root{--bg:#0d0f14;--fg:#f4f1ea;--muted:#9aa0ac;--accent:#e8825a;--accent2:#7cc4a8}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
  #stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:6vw}
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:8vw;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease;pointer-events:none}
  .scene.on{opacity:1;transform:none}
  .kicker{font:600 clamp(12px,1.4vw,16px)/1 system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:2vh}
  h1{font-size:clamp(34px,6.5vw,88px);line-height:1.05;font-weight:400;max-width:16ch}
  h2{font-size:clamp(28px,4.6vw,60px);line-height:1.1;font-weight:400;max-width:20ch;margin-bottom:3vh}
  p.sub{font:clamp(16px,2vw,26px)/1.5 system-ui,sans-serif;color:var(--muted);max-width:44ch;margin-top:3vh}
  ul{list-style:none;font:clamp(16px,2.1vw,28px)/1.4 system-ui,sans-serif}
  li{padding:1.2vh 0;opacity:0;transform:translateX(-20px);transition:all .7s ease}
  .on li{opacity:1;transform:none}
  li b{color:var(--accent2);font-weight:600}
  .on li:nth-child(1){transition-delay:.5s}.on li:nth-child(2){transition-delay:1.5s}
  .on li:nth-child(3){transition-delay:2.5s}.on li:nth-child(4){transition-delay:3.5s}
  .code{font:clamp(12px,1.5vw,19px)/1.6 ui-monospace,Consolas,monospace;background:#161a22;border:1px solid #262b36;border-radius:12px;padding:2.5vh 2vw;max-width:60ch;color:#cfd6e4;white-space:pre}
  .code .c{color:#6b7485}.code .k{color:var(--accent)}.code .g{color:var(--accent2)}
  .cta{color:var(--accent);font-style:italic}
  #bar{position:fixed;left:0;bottom:0;height:4px;background:var(--accent);width:0;transition:width .3s linear}
  #ctrl{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:5}
  button{font:600 14px system-ui,sans-serif;background:#1b202a;color:var(--fg);border:1px solid #2d3441;border-radius:8px;padding:9px 14px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  #start{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
  #start button{font-size:20px;padding:16px 34px;background:var(--accent);color:#1a1108;border:0}
  #cap{position:fixed;left:0;right:0;bottom:5vh;text-align:center;font:clamp(14px,1.7vw,22px)/1.4 system-ui,sans-serif;color:#dcd8cf;padding:0 8vw;text-shadow:0 2px 8px #000}
</style>
</head>
<body>
<div id="start">
  <div class="kicker">Presentación en video</div>
  <h2 style="text-align:center;max-width:none">Sonnet 5.5</h2>
  <button id="go">▶ Reproducir con narración</button>
  <button id="goMute" style="font-size:14px">Reproducir sin voz</button>
</div>

<div id="ctrl"><button id="pause">⏸ Pausa</button><button id="restart">↺ Reiniciar</button></div>
<div id="stage"></div>
<div id="cap"></div>
<div id="bar"></div>

<script>
const scenes = [
 { t: 6, say: "Hola. Soy Sonnet 5.5, un modelo de Anthropic. Voy a explicarte en un minuto por qué vale la pena ponerme a trabajar en tu equipo.",
   html: `<div class="kicker">Hola, soy</div><h1>Sonnet 5.5</h1><p class="sub">Un ingeniero de software que no se cansa, lee todo tu código y explica lo que hace.</p>` },
 { t: 7, say: "No solo escribo código. Entiendo el proyecto completo: leo archivos, busco dónde vive un error, y propongo cambios que respetan el estilo que ya existe.",
   html: `<div class="kicker">Ingeniería</div><h2>Entiendo tu proyecto, no solo tu pregunta.</h2><ul><li><b>Leo</b> y navego bases de código enteras</li><li><b>Depuro</b> hasta encontrar la causa raíz</li><li><b>Escribo</b> código que se parece al tuyo</li><li><b>Pruebo</b> lo que cambio antes de decir que funciona</li></ul>` },
 { t: 7, say: "Trabajo con herramientas reales: la terminal, git, el navegador, hojas de cálculo, documentos y presentaciones. Puedo encargarme de tareas de varios pasos, de principio a fin.",
   html: `<div class="kicker">Autonomía</div><h2>De la idea al resultado.</h2><div class="code"><span class="c"># una tarea, varios pasos</span>
<span class="k">1.</span> leer el repositorio
<span class="k">2.</span> reproducir el fallo
<span class="k">3.</span> corregirlo y ejecutar pruebas
<span class="k">4.</span> <span class="g">commit listo para revisión</span></div>` },
 { t: 6, say: "Hablo español, inglés y muchos otros idiomas. Puedo explicar un concepto difícil a un principiante o discutir arquitectura con un experto, según necesites.",
   html: `<div class="kicker">Comunicación</div><h2>Claro para novatos. Preciso para expertos.</h2><p class="sub">Documentación, análisis de datos, informes, correos, tutorías: mismo criterio, distinto tono.</p>` },
 { t: 7, say: "Y soy honesto. Si algo falla, te lo digo con el error. Si no estoy seguro, lo marco. Si una acción es delicada, te pregunto antes de hacerla. Prefiero que confíes en mí a impresionarte.",
   html: `<div class="kicker">Confianza</div><h2>Digo lo que hice, y lo que no pude.</h2><ul><li><b>Reporto</b> fallos tal como son</li><li><b>Pregunto</b> antes de acciones irreversibles</li><li><b>Respeto</b> tus permisos y tu privacidad</li></ul>` },
 { t: 6, say: "Tengo límites, y conviene que los conozcas: no tengo memoria entre conversaciones salvo la que me des, y necesito que revises lo importante. Soy un buen colega, no un reemplazo del criterio humano.",
   html: `<div class="kicker">Sinceridad</div><h2>Un buen colega, no un reemplazo de tu criterio.</h2><p class="sub">Trabajo mejor con contexto claro y con alguien que revise las decisiones importantes.</p>` },
 { t: 7, say: "Así que esta es mi propuesta: dame una tarea real, aunque sea pequeña. Un error pendiente, una hoja de cálculo, un informe. Si no te convence el resultado, no pierdes nada. Y si sí, seguimos. Gracias por tu tiempo.",
   html: `<div class="kicker">Mi propuesta</div><h1>Pruébame con una tarea real.</h1><p class="sub cta">Sin compromiso. Empecemos hoy.</p>` }
];

const stage = document.getElementById('stage'), bar = document.getElementById('bar'), cap = document.getElementById('cap');
const els = scenes.map(s => { const d = document.createElement('div'); d.className='scene'; d.innerHTML=s.html; stage.appendChild(d); return d; });
const total = scenes.reduce((a,s)=>a+s.t,0);
let i=-1, timer=null, elapsed=0, paused=false, voice=true, tick=null;

function pickVoice(){ const v = speechSynthesis.getVoices(); return v.find(x=>/es[-_](ES|MX|CO|US)/i.test(x.lang)) || v.find(x=>x.lang.startsWith('es')); }
function speak(text){
  if(!voice||!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang='es-ES'; const v=pickVoice(); if(v) u.voice=v; u.rate=1.02;
  speechSynthesis.speak(u);
}
function show(n){
  els.forEach((e,k)=>e.classList.toggle('on',k===n));
  if(n>=0){ cap.textContent=scenes[n].say; speak(scenes[n].say); }
}
function next(){
  i++;
  if(i>=scenes.length){ clearInterval(tick); cap.textContent=''; return; }
  show(i);
  timer = setTimeout(next, scenes[i].t*1000 + 1500);
}
function play(withVoice){
  voice=withVoice; document.getElementById('start').style.display='none';
  i=-1; elapsed=0; clearTimeout(timer); clearInterval(tick);
  const full = total + scenes.length*1.5;
  tick = setInterval(()=>{ if(!paused){ elapsed+=0.3; bar.style.width=Math.min(100,elapsed/full*100)+'%'; } },300);
  next();
}
document.getElementById('go').onclick=()=>play(true);
document.getElementById('goMute').onclick=()=>play(false);
document.getElementById('restart').onclick=()=>{ speechSynthesis.cancel(); paused=false; document.getElementById('pause').textContent='⏸ Pausa'; play(voice); };
document.getElementById('pause').onclick=(e)=>{
  paused=!paused; e.target.textContent = paused?'▶ Seguir':'⏸ Pausa';
  if(paused){ clearTimeout(timer); speechSynthesis.pause(); }
  else { speechSynthesis.resume(); timer=setTimeout(next, 3000); }
};
speechSynthesis.onvoiceschanged=()=>{};
</script>
</body>
</html>
